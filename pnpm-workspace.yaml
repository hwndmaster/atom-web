packages:
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

# Supply-chain protection: refuse package versions published less than 5 days
# ago (value in minutes). Malicious/compromised releases are usually discovered and
# unpublished within days; this keeps freshly published versions out of the tree.
minimumReleaseAge: 7200

# TypeScript stays on 6.x for now: TS 7 (native compiler) has no JS Compiler API,
# which tsup's dts build (rollup-plugin-dts) requires.
# PrimeReact stays on 10.x deliberately: v11 is headless (no shipped styling) and
# requires a PrimeUI license key — re-evaluate when its styled layer matures.
# Locked here so that `pnpm update --latest` cannot bump them accidentally.
updateConfig:
  ignoreDependencies:
    - typescript
    - primereact

